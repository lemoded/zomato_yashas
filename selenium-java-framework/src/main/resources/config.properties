# =====================================================================
# Framework Configuration
# All values below are read dynamically by PropertyUtils.
# Never hardcode these values inside Java classes.
# Any of these can be overridden from the command line, e.g.:
#   mvn test -Dbrowser=firefox -Dheadless=true -Denvironment=uat
# =====================================================================

# ---- Browser configuration ----
browser=chrome
headless=false

# ---- Application under test ----
# https://www.saucedemo.com is a public, automation-friendly demo app -
# used here so the sample LoginPage/DashboardPage/HomePage + TestData.xlsx
# work end-to-end out of the box. Point this at your real AUT.
#url=https://www.saucedemo.com
url=https://www.zomato.com/bangalore/restaurants
environment=qa

# ---- Timeouts (in seconds) ----
implicitWait=15
explicitWait=15
pageLoadTimeout=30
scriptTimeout=30

# ---- Reporting ----
screenshotOnFailure=true
